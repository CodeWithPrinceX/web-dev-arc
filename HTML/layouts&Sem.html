<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layouts and Semantic tags</title>
</head>

<body>
    <header>
        <h1>Layouts and Semantic tags</h1>
        <div>
            <span>Home</span>
            <span>About</span>
        </div>
    </header>

    <main>
        <section>

            <p>hello world</p>
            <input type="text">

        </section>

        <section>

            <div></div>
            <ul>
                <li>dadafafafa</li>
            </ul>

        </section>

        <section>

            <form action="">
                <input type="text">
                <input type="text">
            </form>

        </section>

        <footer>
            <p>Footer part</p>
        </footer>

        <!-- Bonus tags -->

        <abbr title="Hyper text markup language">HTML</abbr>

        <progress max="100" value="40"></progress>

        <details>
            <summary>Open now</summary>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Vero aliquid laborum error rerum dolores neque
                ullam debitis repudiandae ab soluta?</p>
        </details>
        
    </main>

</body>

</html>
