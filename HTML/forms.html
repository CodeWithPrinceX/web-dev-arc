<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms..</title>
</head>

<body>
    <h1>Forms...</h1>
    <form>
        <fieldset>
            <legend>Personal Info</legend>
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Name"> <br><br>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Email"> <br><br>
            <label for="age">Age</label>
            <input type="number" id="age" placeholder="Age"><br><br>
            <label for="mobile">Mobile</label>
            <input type="number" id="mobile" placeholder="Mobile"><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Address</legend>
            <input type="text" placeholder="Street Name"><br><br>
            <input type="text" placeholder="Locality or City"><br><br>
            <input type="text" placeholder="State"><br>
        </fieldset>

        <br>

        <span>Select Language: </span>

        <select>
            <option>Hindi</option>
            <option>English</option>
            <option>German</option>
        </select>

        <br>
        <br>

        <span>Accept terms and condition</span> <input type="checkbox">

        <br>

        <button style="color: black; background-color: lightblue;">Create</button>
    </form>
</body>

</html>
