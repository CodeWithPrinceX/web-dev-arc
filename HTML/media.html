<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>

<body>
    <h1>Media...</h1>

    <p>For image</p>
    <img width="400" src="sampleImg.jpg" alt="">
    <!-- width attribue is to set the width of the media -->

    <p>For video's</p>
    <video width="400" controls src="sampleVideo.mp4"></video>
    <!-- Two attributes for video 1> autopplay loop and 2> controls -->

    <p>for audio's</p>
    <audio controls src="sampleAudio.mp3"></audio>

</body>

</html>
